
name: workflow1

on:
  push:
    branches:
      - main

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v2
      - name: execute job1.py
        run: python job1.py

  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: checkout code
        uses: actions/checkout@v2
      - name: execute job1.py
        run: python job1.py

  job3:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: checkout code
        uses: actions/checkout@v2
      - name: execute job1.py
        run: python job1.py

  job4:
    runs-on: ubuntu-latest
    needs: job2
    steps:
      - name: checkout code
        uses: actions/checkout@v2
      - name: execute job1.py
        run: python job1.py

  job5:
    runs-on: ubuntu-latest
    needs: job3
    steps:
      - name: checkout code
        uses: actions/checkout@v2
      - name: execute job1.py
        run: python job1.py

  job6:
    runs-on: ubuntu-latest
    needs: [job4, job5]
    steps:
      - name: checkout code
        uses: actions/checkout@v2
      - name: execute job1.py
        run: python job1.py
