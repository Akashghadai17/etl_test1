name: elt_workflow1
on:
  push:
    branches:
    - main
jobs:
    extract_job:
      runs-on: ubuntu-latest
      steps:
        - name: checkout code
          uses: actions/checkout@v2
        - name: execute extract.py
          run: python extract.py
      
    tranform_job:
      runs-on: ubuntu-latest
      needs: extract_job
      steps:
        - name: checkout code
          uses: actions/checkout@v2
        - name: execute transform.py
          run: python transform.py
    
    load_job:
      runs-on: ubuntu-latest
      needs: tranform_job
      steps:
        - name: checkout code
          uses: actions/checkout@v2
        - name: execute load.py
          run: python load.py

  
